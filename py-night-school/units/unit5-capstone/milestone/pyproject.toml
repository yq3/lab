[project]
name = "unit5-milestone"
version = "0.1.0"
description = "Unit 5 里程碑（毕业设计收口件）：四层合体 PoC（L5.4 对版）+ 三条主链路 pytest 集成测试 + JAVA-MAPPING.md 定稿"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-openai>=0.3",
    "pydantic>=2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # 验收面 = 毕业测试；L5.4 讲义区的 80 个测试留在 L5.4 重验（README 命令清单）
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"  # 三链路测试全异步面（对齐 L5.4/L5.2：async 测试函数免装饰器，宪法「三态全绿」优先）

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # JAVA-MAPPING.md 是手工对齐的教学文档，不参与 format（对版 L5.4）

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"api.py" = ["B008"]  # FastAPI 的 Depends/Header 惯用「默认值里调用」形态（对版 L5.2/L5.4）

[tool.ruff.lint.isort]
known-first-party = [
    "advice",
    "api",
    "approvals",
    "audit_cache",
    "demo",
    "demo_final",
    "eventstore",
    "executor",
    "gate",
    "graduation_checks",
    "graph",
    "hints",
    "mock_endpoint",
    "mock_tools",
    "plan",
    "prompts",
    "review_rules",
    "step1_gate",
    "versioning",
]

[tool.pyright]
include = ["*.py", "tests"]
extraPaths = ["."]
typeCheckingMode = "basic"
