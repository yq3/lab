[project]
name = "l52-approval-api"
version = "0.1.0"
description = "L5.2 毕业设计②：审批外化——REST 建单、SSE 推送与三元回复（interrupt 换芯 + asyncio 挂起 + 断线重放不丢单）"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-openai>=0.3",
    "pydantic>=2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"
asyncio_mode = "auto"  # FastAPI 异步面：async 测试函数免装饰器（宪法「三态全绿」优先）

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"code/api.py" = ["B008"]  # FastAPI 的 Depends/Header 惯用「默认值里调用」形态——对照 Spring @Autowired 的显式传函数

[tool.ruff.lint.isort]
known-first-party = [
    "advice",
    "api",
    "approvals",
    "demo",
    "demo_flow",
    "executor",
    "graph",
    "mock_endpoint",
    "mock_tools",
    "plan",
    "prompts",
    "review_rules",
    "step1_suspend",
    "ex1_ticket",
    "ex2_replay",
    "ex3_always",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
