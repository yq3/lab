[project]
name = "l38-comparison"
version = "0.1.0"
description = "L3.8 对照总结课：mini-agent vs 四框架的能力-成本-锁定性决策表（tablegen 可复现生成）+ 五仓跳读指南 + 结业自查表"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "tablegen",
    "ex1_contract_column",
    "ex2_scenario_map",
    "ex3_selfcheck",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
