[project]
name = "l37-dify-tour"
version = "0.1.0"
description = "L3.7 dify 半日游：compose 拓扑 + DSL 序列化 + 平台能力清单——体感「平台 vs 库」分界"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "capabilities",
    "dsl_reader",
    "topology",
    "ex1_dsl_stats",
    "ex2_capabilities",
    "ex3_compose_edges",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
