# 教学裁剪摘录（非完整文件）：dify 自部署 compose 的服务拓扑骨架。
# 来源：langgenius/dify@79effdd498#docker/docker-compose-template.yaml（docker-compose.yaml
# 由同目录 generate_docker_compose 脚本从该模板 + .env.example 自动生成）。
# 裁剪口径：保留 12 个核心服务的 image / depends_on / ports / profiles / 健康检查骨架；
# 环境变量只留每个服务最代表的 1–3 行；api_websocket（collaboration profile）、certbot、
# ssrf_proxy、local_sandbox、db_mysql 与其余 20 个可选向量库服务（oceanbase/qdrant/milvus/
# elasticsearch/…）整体裁掉，仅以 weaviate 代表「向量库」一格。depends_on 的两种 YAML 写法
# （映射带 condition / 列表）是原文真实形态，ex3 会用到。
services:
  # Init container to fix permissions（原文注释保留：一次性初始化容器）
  init_permissions:
    image: busybox:latest
    restart: "no"

  # API service
  api:
    image: langgenius/dify-api:1.17.1
    restart: always
    environment:
      MODE: api
      AGENT_BACKEND_BASE_URL: ${AGENT_BACKEND_BASE_URL:-http://agent_backend:5050}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # worker service
  # The Celery worker for processing all queues (dataset, workflow, mail, etc.)
  worker:
    image: langgenius/dify-api:1.17.1
    restart: always
    environment:
      MODE: worker
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
      agent_backend:
        condition: service_started

  # worker_beat service
  # Celery beat for scheduling periodic tasks.
  worker_beat:
    image: langgenius/dify-api:1.17.1
    restart: always
    environment:
      MODE: beat
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started

  # Frontend web application.
  web:
    image: langgenius/dify-web:1.17.1
    restart: always
    environment:
      SERVER_CONSOLE_API_URL: ${SERVER_CONSOLE_API_URL:-http://api:5001}

  # The postgres database.
  db_postgres:
    image: postgres:15-alpine
    profiles:
      - postgresql
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-difyai123456}
      POSTGRES_DB: ${DB_DATABASE:-dify}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "db_postgres", "-U", "${DB_USERNAME:-postgres}"]
      interval: 1s
      timeout: 3s
      retries: 60

  # The redis cache.
  redis:
    image: redis:6-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-difyai123456}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-difyai123456} ping | grep -q PONG"]

  # The DifySandbox
  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: always

  # The plugin daemon
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    restart: always
    environment:
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
    depends_on:
      db_postgres:
        condition: service_healthy
        required: false

  # dify-agent 后端（v2 架构新组件：dify-agent/ 目录的 FastAPI 服务，跑 Agenton 组装的 Pydantic AI）
  agent_backend:
    image: langgenius/dify-agent-backend:1.17.1
    restart: always
    environment:
      DIFY_AGENT_REDIS_URL: ${DIFY_AGENT_REDIS_URL:-redis://:${REDIS_PASSWORD:-difyai123456}@redis:6379/2}
      DIFY_AGENT_PLUGIN_DAEMON_URL: ${DIFY_AGENT_PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
    depends_on:
      redis:
        condition: service_started
      plugin_daemon:
        condition: service_started

  # The nginx service（注意：depends_on 用的是列表写法，与上面的映射写法对照）
  nginx:
    image: nginx:latest
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}"
      - "${EXPOSE_NGINX_SSL_PORT:-443}:${NGINX_SSL_PORT:-443}"

  # The Weaviate vector store（20 个可选向量库服务的代表，VECTOR_STORE 选中谁谁上岗）
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.2
    profiles:
      - weaviate
    restart: always
