[project]
name = "l32-langgraph-basics"
version = "0.1.0"
description = "L3.2 langgraph ①：StateGraph / 状态 schema / 条件边 / subgraph——报销单审查 agent 换图引擎重做"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "langchain-openai>=0.3",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "advice",
    "demo",
    "mock_endpoint",
    "mock_tools",
    "review_rules",
    "ex1_wiring",
    "ex2_events",
    "ex3_gate",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
