[project]
name = "unit3-milestone"
version = "0.1.0"
description = "Unit 3 里程碑：选型工作台——四框架同题 demo 全量重验 + 决策表数据页 + 对照笔记收口"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "bench",
    "hints",
    "summary",
    "tablegen",
]

[tool.pyright]
include = ["*.py", "tests"]
extraPaths = ["."]
typeCheckingMode = "basic"
