[project]
name = "l25-mcp"
version = "0.1.0"
description = "L2.5 MCP：官方 SDK 写 server（财务 mock 工具×3）+ client 消费 + 桥接进 agent 循环"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "bridge",
    "finance_server",
    "ex1_mcp_server",
    "ex2_bridge",
    "ex3_mcp_client",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
