[project]
name = "l19-asyncio-2"
version = "0.1.0"
description = "L1.9 asyncio ②：并发原语与异步生成器（gather/超时取消/限流/async for）"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "tasks_and_gather",
    "timeout_demo",
    "semaphore_demo",
    "token_stream",
    "cancel_demo",
    "ex1_gather_fetch",
    "ex2_timeout_fallback",
    "ex3_token_stream",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
