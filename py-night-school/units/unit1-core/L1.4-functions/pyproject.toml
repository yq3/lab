[project]
name = "l14-functions"
version = "0.1.0"
description = "L1.4 函数是一等公民：闭包、*args/**kwargs、高阶函数与推导式（unit1-core 第 4 课）"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "preapprove_rules",
    "closures",
    "reporting",
    "tool_bridge",
    "ex1_rule_chain",
    "ex2_closures",
    "ex3_report",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
