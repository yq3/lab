[project]
name = "l18-asyncio-1"
version = "0.1.0"
description = "L1.8 asyncio ①：事件循环与协程（单线程协作式并发的地基课）"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "first_steps",
    "coroutine_object",
    "blocking_disaster",
    "yield_point",
    "ex1_main_flow",
    "ex2_fix_blocking",
    "ex3_coroutine_fates",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
