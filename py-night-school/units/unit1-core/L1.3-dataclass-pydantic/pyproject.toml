[project]
name = "l13-dataclass-pydantic"
version = "0.1.0"
description = "L1.3 数据建模：dataclass 与 Pydantic v2（unit1-core 第 3 课）"
requires-python = ">=3.12"
# pydantic 是本课第一个「运行时依赖」：讲义代码 import 它、产品代码跑在它上面。
# 对照 Java：这是 compile scope，不是 pytest/ruff 那种 test / 工具 scope（见 [dependency-groups]）。
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["naive_claim", "dataclass_claim", "claims", "ex1_dataclass", "ex2_schema", "ex3_batch"]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
