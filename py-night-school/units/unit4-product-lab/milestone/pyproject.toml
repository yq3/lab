[project]
name = "unit4-milestone"
version = "0.1.0"
description = "Unit 4 里程碑：产品改造工作台——三课机制件跨课重验 + 三份产品改造说明收口"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "verify",
    "hints",
]

[tool.pyright]
include = ["*.py", "tests"]
extraPaths = ["."]
typeCheckingMode = "basic"
