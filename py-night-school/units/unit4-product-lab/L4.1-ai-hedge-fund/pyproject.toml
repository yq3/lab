[project]
name = "l41-ai-hedge-fund"
version = "0.1.0"
description = "L4.1 ai-hedge-fund：层级投票——LLM 影响力终止于 Signal（机制抽取件映射到报销初审）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "pyright>=1.1",
    "nodejs-wheel-binaries>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["code", "exercises"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]  # 讲义代码块是手工对齐的教学代码，不参与 format

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "blend",
    "cache",
    "demo",
    "demo_trace",
    "limits",
    "mock_endpoint",
    "pipeline",
    "review",
    "reviewers",
    "snapshot",
    "step1_blend",
    "step2_cache",
    "step3_limits",
    "ex1_weights",
    "ex2_cache",
    "ex3_limits",
]

[tool.pyright]
include = ["code", "exercises"]
extraPaths = ["code", "exercises"]
typeCheckingMode = "basic"
