[project]
name = "taxagent-shared"
version = "0.1.0"
description = "计税申报 multi-agent demo —— 平台公共件（LLM 工厂 / agent 注册表 / A2A 适配层），同时是 uv workspace 根"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 平台栈统一在此声明，各 agent 团队只依赖 taxagent-shared，避免版本漂移
    "deepagents==0.7.13",
    "langchain-openai>=1.0.0",
    "a2a-sdk[fastapi]>=1.3.0,<2",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv.workspace]
members = ["agents/*"]

# ---- 构建后端：把 shared/ 打包为可导入的 `shared` 包 ----
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

# ---- 工具链（与 py-night-school 同款纪律）----
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
