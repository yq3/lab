[project]
name = "taxagent-filing"
version = "0.1.0"
description = "申报 agent（申报报送团队）：申报表生成/校验/提交，A2A 长任务 + input_required 示范"
requires-python = ">=3.12"
dependencies = ["taxagent-shared"]

[tool.uv.sources]
taxagent-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tax_filing"]
