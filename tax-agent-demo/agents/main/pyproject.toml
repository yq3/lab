[project]
name = "taxagent-main"
version = "0.1.0"
description = "主 agent：计税申报入口（意图路由 + A2A 委派 + HITL 审批），deepagents 全特性装配示范"
requires-python = ">=3.12"
dependencies = ["taxagent-shared"]

[tool.uv.sources]
taxagent-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tax_main"]
